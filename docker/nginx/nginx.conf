# Resolución de nombres en tiempo de petición: nginx arranca aunque el frontend
# aún no esté listo y tolera reinicios de los contenedores sin cachear IPs.
resolver 127.0.0.11 valid=10s ipv6=off;

# Límites por IP. Solo los endpoints que validan credenciales o envían correo
# usan la cuota estricta; las lecturas de sesión (/auth/me) usan la cuota general.
map $uri $auth_limit_key {
    default "";
    ~^/api/v1/auth/(login|forgot-password|reset-password)$ $binary_remote_addr;
}
limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
limit_req_zone $auth_limit_key zone=api_auth:10m rate=60r/m;
limit_conn_zone $binary_remote_addr zone=per_ip:10m;

map $http_x_forwarded_proto $hsts_header {
    default "";
    https   "max-age=31536000; includeSubDomains";
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 25m;
    client_body_timeout 30s;
    keepalive_timeout 30s;
    send_timeout 60s;
    limit_conn per_ip 30;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security $hsts_header always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://checkout.wompi.co https://production.wompi.co https://sandbox.wompi.co; manifest-src 'self'; worker-src 'self' blob:; object-src 'none'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Autenticación: la cuota anti fuerza bruta solo cuenta los endpoints
    # sensibles definidos en $auth_limit_key; el resto usa la cuota general.
    location ^~ /api/v1/auth/ {
        limit_req zone=api_auth burst=20 nodelay;
        limit_req_status 429;
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location /api/ {
        limit_req zone=api_general burst=60 nodelay;
        limit_req_status 429;
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location = /manifest.webmanifest {
        set $manifest http://backend:8080/api/v1/public/manifest.webmanifest;
        proxy_pass $manifest;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /swagger-ui/ {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /swagger-ui.html {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v3/api-docs {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /actuator/health {
        set $backend http://backend:8080;
        proxy_pass $backend;
    }

    # Frontend (Angular/Ionic PWA) servido por su propio Nginx.
    location / {
        set $frontend http://frontend:80;
        proxy_pass $frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        error_page 502 503 504 = @frontend_missing;
    }

    location @frontend_missing {
        default_type text/html;
        return 503 '<!doctype html><meta charset="utf-8"><title>Servicio no disponible</title><body style="font-family:sans-serif;max-width:40rem;margin:4rem auto"><h1>Frontend no disponible</h1><p>El servicio web aún no está listo. Verifica el estado con <code>docker compose ps</code>.</p><p><a href="/swagger-ui.html">Documentación de la API (Swagger)</a></p></body>';
    }
}
