# Resolución de nombres en tiempo de petición: nginx arranca aunque el frontend aún no exista.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    client_max_body_size 25m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # API, documentación y health del backend
    location /api/ {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /swagger-ui/ {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
    }

    location = /swagger-ui.html {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
    }

    location /v3/api-docs {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
    }

    location = /actuator/health {
        set $backend http://backend:8080;
        proxy_pass $backend;
    }

    # Frontend (Angular/Ionic PWA). Si aún no está desplegado, muestra un aviso.
    location / {
        set $frontend http://frontend:80;
        proxy_pass $frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        error_page 502 503 504 = @frontend_missing;
    }

    location @frontend_missing {
        default_type text/html;
        return 503 '<!doctype html><meta charset="utf-8"><title>Vecindad</title><body style="font-family:sans-serif;max-width:40rem;margin:4rem auto"><h1>API activa</h1><p>El frontend todavía no está desplegado. Descomprime vecindad-frontend.zip en ./frontend y ejecuta <code>docker compose --profile frontend up -d --build</code>.</p><p><a href="/swagger-ui.html">Documentación de la API (Swagger)</a></p></body>';
    }
}
