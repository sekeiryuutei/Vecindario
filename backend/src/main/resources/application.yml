spring:
  application:
    name: vecindad-backend
  datasource:
    url: jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:vecindad}
    username: ${DATABASE_USERNAME:vecindad}
    password: ${DATABASE_PASSWORD:vecindad}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:20}
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration/global
    schemas: public
    default-schema: public
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  forward-headers-strategy: native
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p traceId=%X{traceId:-}"

app:
  name: ${APP_NAME:Vecindad}
  company: ${APP_COMPANY:CodeVam}
  env: ${APP_ENV:development}
  mail:
    dev-log-links: ${MAIL_DEV_LOG_LINKS:false}
  jwt:
    secret: ${JWT_SECRET:}
    issuer: vecindad
    access-expiration: ${JWT_ACCESS_EXPIRATION:15m}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:7d}
  security:
    max-failed-attempts: 5
    lock-duration: 15m
    reset-token-ttl: 30m
    invitation-ttl: 72h
    login-rate-limit-per-minute: 10
    bcrypt-strength: 12
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  seed:
    enabled: ${APP_SEED_ENABLED:false}
    password: ${APP_SEED_PASSWORD:Demo#2026!}
