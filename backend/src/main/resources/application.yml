spring:
  application:
    name: vecindad-backend
  datasource:
    url: jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:vecindad}
    username: ${DATABASE_USERNAME:vecindad}
    password: ${DATABASE_PASSWORD:vecindad}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:20}
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration/global
    schemas: public
    default-schema: public
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      repositories:
        enabled: false   # Redis solo se usa vía StringRedisTemplate; evita el modo estricto de repositorios
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}
            required: ${SMTP_STARTTLS:true}
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  forward-headers-strategy: native
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    # El correo es una dependencia externa: una caída de SMTP no debe marcar
    # todo el backend como no saludable ni retirarlo de rotación.
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:false}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p traceId=%X{traceId:-}"

app:
  name: ${APP_NAME:Vecindad}
  company: ${APP_COMPANY:CodeVam}
  env: ${APP_ENV:development}
  public-url: ${APP_PUBLIC_URL:${APP_BASE_URL:http://localhost:48124}}
  mail:
    dev-log-links: ${MAIL_DEV_LOG_LINKS:false}
    from: ${MAIL_FROM:${SMTP_FROM:no-reply@localhost}}
  jwt:
    secret: ${JWT_SECRET:}
    issuer: vecindad
    access-expiration: ${JWT_ACCESS_EXPIRATION:15m}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:7d}
  security:
    max-failed-attempts: 5
    lock-duration: 15m
    reset-token-ttl: 30m
    invitation-ttl: 72h
    login-rate-limit-per-minute: 10
    bcrypt-strength: 12
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  seed:
    enabled: ${APP_SEED_ENABLED:false}
    password: ${APP_SEED_PASSWORD:Demo#2026!}
  bootstrap:
    email: ${APP_BOOTSTRAP_EMAIL:}
    password: ${APP_BOOTSTRAP_PASSWORD:}
    name: ${APP_BOOTSTRAP_NAME:Administrador de plataforma}
  wompi:
    enabled: ${WOMPI_ENABLED:true}
    public-key: ${WOMPI_PUBLIC_KEY:pub_test_demo}
    private-key: ${WOMPI_PRIVATE_KEY:prv_test_demo}
    events-secret: ${WOMPI_EVENTS_SECRET:test_events_secret}
    integrity-secret: ${WOMPI_INTEGRITY_SECRET:test_integrity_secret}
    api-url: ${WOMPI_API_URL:https://sandbox.wompi.co/v1}
    redirect-url: ${WOMPI_REDIRECT_URL:http://localhost:48124/pagos/wompi/resultado}
  storage:
    local-dir: ${STORAGE_LOCAL_DIR:/tmp/vecindad-storage}
  maintenance:
    token-cleanup-cron: ${TOKEN_CLEANUP_CRON:0 30 3 * * *}
    token-retention-days: ${TOKEN_RETENTION_DAYS:30}

