name: vecindad

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  vecindad_postgresql:
    image: postgres:16-alpine
    container_name: vecindad_postgresql
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-vecindad}
      POSTGRES_USER: ${DATABASE_USERNAME:-vecindad}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Define DATABASE_PASSWORD en .env}
      TZ: America/Bogota
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-48122}:5432"
    volumes:
      - vecindad_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      vecindad_net:
        aliases: [postgres]

  vecindad_redis:
    image: redis:7-alpine
    container_name: vecindad_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Define REDIS_PASSWORD en .env}"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-48123}:6379"
    volumes:
      - vecindad_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      vecindad_net:
        aliases: [redis]

  # OPCIONAL (perfil "storage"): servidor S3 compatible para quienes no usan
  # almacenamiento local. El backend usa STORAGE_LOCAL_DIR por defecto.
  vecindad_minio:
    profiles: ["storage"]
    image: quay.io/minio/minio:latest
    container_name: vecindad_minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Define MINIO_ROOT_USER en .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Define MINIO_ROOT_PASSWORD en .env}
    ports:
      - "127.0.0.1:${MINIO_PORT:-48125}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-48126}:9001"
    volumes:
      - vecindad_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging
    networks:
      vecindad_net:
        aliases: [minio]

  vecindad_minio_init:
    profiles: ["storage"]
    image: quay.io/minio/mc:latest
    container_name: vecindad_minio_init
    restart: "no"
    depends_on:
      - vecindad_minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-vecindad-files}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do sleep 2; done;
      mc mb --ignore-existing local/$${AWS_S3_BUCKET};
      mc anonymous set none local/$${AWS_S3_BUCKET};
      exit 0;
      "
    logging: *default-logging
    networks:
      - vecindad_net

  vecindad_backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: vecindad/backend:local
    container_name: vecindad_backend
    restart: unless-stopped
    depends_on:
      vecindad_postgresql:
        condition: service_healthy
      vecindad_redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${APP_ENV:-development}
      APP_NAME: ${APP_NAME:-Vecindad}
      APP_COMPANY: ${APP_COMPANY:-CodeVam}
      APP_ENV: ${APP_ENV:-development}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:48124}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env (mínimo 32 caracteres)}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-15m}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-7d}
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: ${DATABASE_NAME:-vecindad}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-vecindad}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      APP_SEED_ENABLED: ${APP_SEED_ENABLED:-false}
      APP_SEED_PASSWORD: ${APP_SEED_PASSWORD:-Demo#2026!}
      APP_BOOTSTRAP_EMAIL: ${APP_BOOTSTRAP_EMAIL:-}
      APP_BOOTSTRAP_PASSWORD: ${APP_BOOTSTRAP_PASSWORD:-}
      APP_BOOTSTRAP_NAME: ${APP_BOOTSTRAP_NAME:-Administrador de plataforma}
      MAIL_DEV_LOG_LINKS: ${MAIL_DEV_LOG_LINKS:-false}
      MAIL_HEALTH_ENABLED: ${MAIL_HEALTH_ENABLED:-false}
      MAIL_FROM: ${MAIL_FROM:-no-reply@localhost}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      STORAGE_LOCAL_DIR: /app/storage
      TOKEN_CLEANUP_CRON: ${TOKEN_CLEANUP_CRON:-0 30 3 * * *}
      TOKEN_RETENTION_DAYS: ${TOKEN_RETENTION_DAYS:-30}
      WOMPI_ENABLED: ${WOMPI_ENABLED:-true}
      WOMPI_PUBLIC_KEY: ${WOMPI_PUBLIC_KEY:-}
      WOMPI_PRIVATE_KEY: ${WOMPI_PRIVATE_KEY:-}
      WOMPI_EVENTS_SECRET: ${WOMPI_EVENTS_SECRET:-}
      WOMPI_INTEGRITY_SECRET: ${WOMPI_INTEGRITY_SECRET:-}
      WOMPI_API_URL: ${WOMPI_API_URL:-https://sandbox.wompi.co/v1}
      WOMPI_REDIRECT_URL: ${WOMPI_REDIRECT_URL:-}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-48121}:8080"
    volumes:
      - vecindad_storage:/app/storage
    tmpfs:
      - /tmp:size=64m
    read_only: true
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s
    logging: *default-logging
    networks:
      vecindad_net:
        aliases: [backend]

  vecindad_frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile
    image: vecindad/frontend:local
    container_name: vecindad_frontend
    restart: unless-stopped
    depends_on:
      vecindad_backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-48120}:80"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging
    networks:
      vecindad_net:
        aliases: [frontend]

  vecindad_nginx:
    image: nginx:1.27-alpine
    container_name: vecindad_nginx
    restart: unless-stopped
    depends_on:
      vecindad_backend:
        condition: service_healthy
      vecindad_frontend:
        condition: service_healthy
    ports:
      - "${NGINX_PORT:-48124}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging
    networks:
      - vecindad_net

networks:
  vecindad_net:
    name: vecindad_net

volumes:
  vecindad_postgres_data:
  vecindad_redis_data:
  vecindad_minio_data:
  vecindad_storage:
